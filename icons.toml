# [[variant]]: versión a color de un icono que Nerd Fonts ya trae en monocromo. Solo en
# AI Symbols. El codepoint de Nerd Fonts da el icono en el color del tema y este, el
# color de marca. verify.py comprueba que nf_cp siga existiendo en Nerd Fonts.
# OpenAI y GitHub Copilot no están: en devicons también son negros.
#   nf_cp, nf_name  icono equivalente en Nerd Fonts
#   note            texto opcional para el README

[[variant]]
cp = "E060"
name = "claude-icon"
label = "Claude"
nf_cp = "EC82"
nf_name = "nf-cod-claude"

