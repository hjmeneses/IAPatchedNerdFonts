# Iconos de IA y versiones de upstream. Es la única fuente de datos de patch_all.py,
# build_symbols.py, los verificadores y las tablas del README (python icons.py readme).
#
# Agregar un icono: un [[icon]] con el siguiente codepoint libre del rango y el nombre
# del glifo en devicons (dist/devicons.ttf). CI construye y verifica las fuentes.

[upstream]
nerd_fonts = "3.5.1"   # release de ryanoasis/nerd-fonts (CascadiaCode.tar.xz)
devicons = "2.4.0"     # paquete npm devicons

# Hueco libre tras Pomicons (U+E000–E00A), que no ha cambiado en años. patch_all.py
# se niega a parchear si la fuente de Nerd Fonts ya tiene algún glifo en el rango.
[range]
start = "E00B"
end = "E09F"

# [[icon]]: en las fuentes parcheadas y en AI Symbols
#   cp     codepoint
#   name   glifo de devicons
#   label  nombre para el README
#   group  encabezado de sección en el README (desde ese icono)
#   color  true: capas COLR con los colores del SVG en AI Symbols. Sin color: logos
#          negros (Anthropic, Ollama, Grok...) y los que tienen un contorno monocromo
#          que no coincide con el SVG a color: Kiro (fantasma blanco sobre fondo
#          violeta), Cursor (cubo gris), Hugging Face (dibujo de líneas) y Warp (logo
#          sobre un cuadrado oscuro)
#
# Claude, OpenAI y MCP ya existen en Nerd Fonts: nf-cod-claude U+EC82,
# nf-cod-openai U+EC81, nf-cod-mcp U+EC47.

[[icon]]
cp = "E00B"
name = "claude-code"
label = "Claude Code (robot)"
color = true

