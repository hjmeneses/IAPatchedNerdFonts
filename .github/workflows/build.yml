name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build

      - uses: actions/upload-artifact@v7
        with:
          name: CaskaydiaCove-NerdFont-AI
          path: Patched/*.ttf
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: AISymbols
          path: Symbols/*.ttf
          retention-days: 14
